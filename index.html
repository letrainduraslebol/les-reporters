<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Les reporters — Le train du ras-le-bol</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap"
    rel="stylesheet"
  >

  <style>
    :root {
      --bleu: #002b59;
      --jaune: #ffce3e;
      --blanc: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Poppins", sans-serif;
      background: var(--bleu);

      /* L'entête est fixe : le contenu commence juste dessous,
         puis défile derrière lui. */
      padding-top: 115px;
    }

    /* ==================================================
       ENTÊTE GÉNÉRALE
       ================================================== */

    .header-shell {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;

      width: 100%;
      z-index: 2000;
    }

    .site-header {
      position: relative;

      width: 100%;
      min-height: 110px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px 28px;

      background: var(--bleu);
    }

    /* ==================================================
       MENU PRINCIPAL — 5 BOUTONS SVG ÉGAUX
       ================================================== */

    .desktop-menu {
      width: 100%;
      max-width: 1800px;
      margin: 0 auto;

      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: center;
    }

    .desktop-menu-item {
      position: relative;

      min-width: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      text-decoration: none;
    }

    .desktop-menu-item:not(:last-child)::after {
      content: "";

      position: absolute;
      top: 50%;
      right: 0;

      width: 4px;
      height: 100%;

      background: #ffce3e;

      transform: translateY(-50%);

      box-shadow:
        0 2px 3px rgba(0, 0, 0, 0.30);
    }

    .menu-button-svg {
      display: block;

      width: min(100%, 250px);
      height: auto;
      aspect-ratio: 250 / 56;

      overflow: visible;

      filter:
        drop-shadow(0 2px 2px rgba(0, 0, 0, 0.34))
        drop-shadow(0 3px 4px rgba(0, 0, 0, 0.18));

      transition:
        transform 0.20s ease,
        filter 0.20s ease;
    }

    .desktop-menu-item:hover .menu-button-svg,
    .desktop-menu-item:focus-visible .menu-button-svg {
      transform: translateY(-1px);

      filter:
        brightness(1.06)
        drop-shadow(0 2px 2px rgba(0, 0, 0, 0.34))
        drop-shadow(0 3px 4px rgba(0, 0, 0, 0.18));
    }

    .desktop-menu-item:focus-visible {
      outline: 2px solid #ffce3e;
      outline-offset: 4px;
      border-radius: 4px;
    }

    .mobile-home-link {
      display: none;
    }

    .white {
      color: var(--blanc);
    }

    .yellow {
      color: var(--jaune);
    }

    /* ==================================================
       MENU HAMBURGER
       MASQUÉ SUR PC
       ================================================== */

    .menu-toggle {
      display: none;
    }

    .mobile-menu {
      display: none;
    }

    /* ==================================================
       TRANSITION JAUNE
       DE BOUT EN BOUT
       ================================================== */

    .header-transition {
      display: block;
      width: 100%;
      height: 5px;
      margin: 0;

      background: #ffce3e;

      box-shadow:
        0 2px 3px rgba(0, 0, 0, 0.30),
        0 4px 8px rgba(0, 0, 0, 0.16);
    }

    /* ==================================================
       HERO D'ACCUEIL — ZONE PRINCIPALE
       ================================================== */

    .home-hero {
      width: 100%;
      overflow-x: clip;
      background: #002b59;
    }

    .hero-main {
      width: 100%;
      background: #002b59;
      padding: clamp(38px, 3.7vw, 76px) clamp(36px, 3.8vw, 78px);
    }

    .hero-main-inner {
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;

      display: grid;
      grid-template-columns: minmax(0, 49fr) minmax(0, 51fr);
      column-gap: clamp(36px, 2.75vw, 56px);
      align-items: stretch;

      /* À 2048 px, la zone utile fait environ 594 px de haut,
         comme sur la maquette fournie. */
      min-height: clamp(540px, 29vw, 594px);
    }

    /* Les deux colonnes partagent exactement la même hauteur de rangée. */
    .hero-copy {
      min-width: 0;

      display: flex;
      flex-direction: column;
      justify-content: center;

      /* Léger décalage vers le bas pour centrer visuellement
         le bloc de gauche par rapport au visuel de droite. */
      padding-top: 18px;

      color: #ffffff;
    }

    .hero-kicker {
      margin: 0 0 6px;

      font-size: clamp(25px, 2.05vw, 40px);
      font-weight: 800;
      line-height: 1.15;
      letter-spacing: -0.02em;

      color: #ffffff;
    }

    .hero-title {
      margin: 0;

      font-size: clamp(52px, 5.15vw, 94px);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: -0.04em;

      white-space: nowrap;
    }

    .hero-title-white {
      color: #ffffff;
    }

    .hero-title-yellow {
      color: #ffce3e;
    }

    .hero-signature {
      width: 100%;
      margin: clamp(18px, 1.9vw, 30px) 0 0;
    }

    .hero-signature img {
      display: block;

      /* Aligné à gauche sur le même axe que les titres. */
      width: min(100%, 570px);
      height: auto;
      margin: 0;
    }

    .hero-concept {
      width: min(100%, 570px);
      margin-top: clamp(22px, 2.5vw, 42px);

      text-align: left;
    }

    .hero-concept-title {
      display: block;
      width: max-content;

      margin: 0 auto clamp(14px, 1.35vw, 20px);
      padding: 5px 11px 6px;

      /* Remonté seul, sans déplacer la ligne des trois concepts. */
      transform: translateY(-18px);

      background: #ffce3e;
      color: #002b59;

      border-radius: 3px;

      font-size: clamp(16px, 1.28vw, 23px);
      font-weight: 800;
      line-height: 1.15;
    }

    .hero-concept-items {
      width: 100%;
      margin: 0;

      display: grid;
      grid-template-columns: max-content 4px max-content 4px max-content;
      justify-content: space-between;
      align-items: center;
      column-gap: clamp(10px, 1.1vw, 18px);
    }

    .hero-concept-item {
      min-width: 0;

      display: flex;
      align-items: center;
      justify-content: flex-start;

      text-align: left;
    }

    .hero-concept-item span {
      display: inline-block;

      padding: 5px 12px 6px;

      background: #ffffff;
      color: #002b59;

      border-radius: 3px;

      font-size: clamp(14px, 1vw, 20px);
      font-weight: 800;
      line-height: 1.15;

      white-space: nowrap;
    }

    .hero-concept-divider {
      display: block;
      width: 4px;
      height: 1.35em;
      background: #ffce3e;
      border-radius: 2px;
      justify-self: center;
    }

    /* Visuel de droite : aucune déformation et aucun recadrage.
       Le SVG d'origine contient des marges transparentes importantes ;
       sa largeur d'affichage est donc réglée indépendamment de la colonne
       pour que l'illustration réellement visible ait la même présence
       verticale que le bloc de texte de gauche. */
    .hero-visual {
      position: relative;
      min-width: 0;
      min-height: 0;

      overflow: visible;
    }

    .hero-visual img {
      position: absolute;
      top: 50%;
      left: 47.5%;

      display: block;
      width: clamp(780px, 50vw, 1040px);
      height: auto;
      max-width: none;
      max-height: none;

      transform: translate(-50%, -50%);
    }

    /* ==================================================
       SÉPARATION ENTRE LES DEUX ZONES
       ================================================== */

    .hero-separator {
      width: 100%;
      height: clamp(12px, 1.15vw, 20px);
      background: #ffce3e;
    }

    /* ==================================================
       HERO D'ACCUEIL — ZONE SECONDAIRE / CHIFFRES
       ================================================== */

    .hero-stats {
      width: 100%;
      background: #002b59;

      padding:
        clamp(62px, 5.4vw, 88px)
        clamp(28px, 3.6vw, 70px)
        clamp(28px, 2.8vw, 44px);
    }

    .hero-stats-grid {
      width: 100%;
      max-width: 1780px;
      margin: 0 auto;

      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: clamp(30px, 3.2vw, 60px);
      align-items: stretch;
    }

    .stat-card {
      position: relative;
      min-width: 0;
      min-height: 190px;

      display: grid;
      grid-template-rows: 1fr auto;
      align-items: center;

      padding: 54px 24px 20px;

      background: #002b59;

      border: 3px solid #ffffff;
      border-radius: 13px;
    }

    .stat-medallion {
      position: absolute;
      top: 0;
      left: 50%;

      width: clamp(82px, 6vw, 104px);
      aspect-ratio: 1 / 1;

      display: flex;
      align-items: center;
      justify-content: center;

      transform: translate(-50%, -50%);

      background: #002b59;
      border: 6px solid #ffce3e;
      border-radius: 50%;
    }

    .stat-medallion img,
    .stat-medallion svg {
      display: block;
      width: 64%;
      height: 64%;

      object-fit: contain;
      object-position: center;
      background: transparent;
    }

    .stat-value {
      width: 100%;
      min-height: 64px;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 6px 16px;

      background: #ffce3e;
      color: #002b59;

      border-radius: 12px;

      font-size: clamp(38px, 3.4vw, 64px);
      font-weight: 800;
      line-height: 1;

      text-align: center;
      white-space: nowrap;
    }

    .stat-label {
      margin-top: 17px;

      color: #ffffff;

      font-size: clamp(15px, 1.28vw, 22px);
      font-weight: 800;
      line-height: 1.2;

      text-align: center;
      white-space: nowrap;
    }

    /* ==================================================
       TABLETTE / ÉCRANS INTERMÉDIAIRES
       ================================================== */

    @media (max-width: 1200px) {
      .hero-main {
        padding-inline: 34px;
      }

      .hero-main-inner {
        grid-template-columns: minmax(0, 50fr) minmax(0, 50fr);
        column-gap: 30px;
        min-height: 500px;
      }

      .hero-title {
        font-size: clamp(48px, 5.4vw, 68px);
      }

      .hero-concept-items {
        grid-template-columns: max-content 4px max-content 4px max-content;
        column-gap: 10px;
      }

      .hero-concept-item span {
        font-size: 13px;
        padding-inline: 7px;
      }

      .hero-concept-divider {
        display: block;
        height: 1.25em;
      }

      .hero-visual img {
        left: 48%;
        width: clamp(600px, 54vw, 720px);
      }

      .hero-stats-grid {
        gap: 22px;
      }

      .stat-card {
        padding-inline: 16px;
      }

      .stat-label {
        font-size: 15px;
      }
    }

    /* ==================================================
       MOBILE
       ================================================== */

    @media (max-width: 800px) {
      body {
        padding-top: 85px;
      }

      .site-header {
        position: relative;

        min-height: 80px;
        padding: 12px 62px 12px 18px;
      }

      .desktop-menu {
        display: none;
      }

      .mobile-home-link {
        display: flex;
        align-items: center;
        justify-content: center;

        width: min(100%, 250px);
        margin: 0 auto;

        text-decoration: none;
      }

      .mobile-home-svg {
        display: block;
        width: min(100%, 210px);
        height: auto;

        filter:
          drop-shadow(0 2px 2px rgba(0, 0, 0, 0.34))
          drop-shadow(0 3px 4px rgba(0, 0, 0, 0.18));
      }

      /* BOUTON HAMBURGER */

      .menu-toggle {
        position: absolute;

        top: 50%;
        right: 18px;

        transform: translateY(-50%);

        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;

        width: 34px;
        height: 30px;
        padding: 0;

        background: transparent;
        border: 0;

        cursor: pointer;

        z-index: 1001;
      }

      .menu-toggle span {
        display: block;

        width: 28px;
        height: 3px;

        margin: 3px 0;

        background: #ffffff;

        border-radius: 2px;

        box-shadow:
          0 2px 3px rgba(0, 0, 0, 0.35);

        transition:
          transform 0.25s ease,
          opacity 0.25s ease;
      }

      /* LE HAMBURGER DEVIENT UNE CROIX QUAND LE MENU EST OUVERT */

      .menu-toggle.is-open span:nth-child(1) {
        transform: translateY(9px) rotate(45deg);
      }

      .menu-toggle.is-open span:nth-child(2) {
        opacity: 0;
      }

      .menu-toggle.is-open span:nth-child(3) {
        transform: translateY(-9px) rotate(-45deg);
      }

      /* MENU DÉPLIANT */

      .mobile-menu {
        position: absolute;

        top: 100%;
        left: 0;
        right: 0;

        z-index: 1000;

        background: #002b59;

        padding: 14px 18px 18px;

        box-shadow:
          0 8px 12px rgba(0, 0, 0, 0.22);
      }

      .mobile-menu.is-open {
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .mobile-menu-link {
        width: 100%;

        padding: 14px 10px;

        font-family: "Poppins", sans-serif;
        font-size: 14px;
        font-weight: 800;

        text-align: center;
        text-decoration: none;

        border-top: 1px solid rgba(255, 255, 255, 0.24);

        text-shadow:
          1px 2px 0 rgba(0, 0, 0, 0.58),
          2px 3px 3px rgba(0, 0, 0, 0.28);
      }

      .mobile-menu-link:last-child {
        border-bottom: 1px solid rgba(255, 255, 255, 0.24);
      }

      .hero-main {
        padding: 38px 20px 42px;
      }

      .hero-main-inner {
        grid-template-columns: 1fr;
        row-gap: 28px;
        min-height: 0;
      }

      .hero-copy {
        padding-top: 0;
        text-align: center;
      }

      .hero-kicker {
        font-size: clamp(23px, 7vw, 31px);
      }

      .hero-title {
        font-size: clamp(43px, 12vw, 67px);
        white-space: normal;
      }

      .hero-signature {
        margin: 14px 0 15px;
      }

      .hero-signature img {
        width: min(100%, 580px);
        margin: 0 auto;
      }

      .hero-concept {
        width: min(100%, 570px);
        margin: 18px auto 0;
        text-align: left;
      }

      .hero-concept-title {
        font-size: 17px;
        transform: none;
      }

      .hero-concept-items {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: flex-start;
        gap: 10px 12px;
      }

      .hero-concept-item {
        justify-content: flex-start;
        text-align: left;
      }

      .hero-concept-item span {
        font-size: 15px;
      }

      .hero-concept-divider {
        display: block;
        width: 3px;
        height: 1.1em;
      }

      .hero-visual {
        position: relative;
        min-height: 0;
        height: auto;
        overflow: visible;

        display: flex;
        justify-content: center;
        align-items: center;
      }

      .hero-visual img {
        position: static;
        top: auto;
        left: auto;

        display: block;
        width: min(100%, 650px);
        height: auto;
        max-width: 100%;
        max-height: none;

        transform: none;
      }

      .hero-separator {
        height: 12px;
      }

      .hero-stats {
        padding: 62px 20px 30px;
      }

      .hero-stats-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 66px 18px;
      }

      .stat-card {
        min-height: 165px;
        padding: 48px 14px 17px;
      }

      .stat-medallion {
        width: 78px;
        border-width: 5px;
      }

      .stat-value {
        min-height: 56px;
        font-size: clamp(34px, 8vw, 48px);
      }

      .stat-label {
        font-size: 13px;
        white-space: normal;
      }
    }

    /* ==================================================
       PETITS ÉCRANS
       ================================================== */

    @media (max-width: 460px) {
      .mobile-home-svg {
        width: min(100%, 190px);
      }

      .menu-toggle {
        right: 14px;
      }

      .hero-main {
        padding-inline: 16px;
      }

      .hero-stats-grid {
        grid-template-columns: 1fr;
        gap: 64px;
      }

      .stat-card {
        width: 100%;
        max-width: 390px;
        margin: 0 auto;
      }
    }
  </style>
</head>

<body>

    <header class="site-header">

      <!-- MENU DESKTOP : 5 ZONES STRICTEMENT ÉGALES -->

      <nav class="desktop-menu" aria-label="Navigation principale">

        <!-- 1. ACCUEIL -->

              font-weight="800"

          </svg>
        </a>

        <!-- 3. NOTRE CONCEPT -->
        <a
          class="desktop-menu-item"

        >
          <svg
            class="menu-button-svg"
            viewBox="0 0 250 56"
            role="img"

            focusable="false"
          >
            <rect x="14" y="5" width="222" height="4" rx="2" fill="#ffffff"/>
            <rect x="14" y="47" width="222" height="4" rx="2" fill="#ffffff"/>

            <text
              x="125"
              y="34"
              text-anchor="middle"
              xml:space="preserve"
              font-family="Poppins, sans-serif"

            ><tspan fill="#ffffff">NOTRE </tspan><tspan fill="#ffce3e">CONCEPT</tspan></text>
          </svg>

        <!-- 4. NOUS REJOINDRE -->
        <a

          <svg

            <rect x="14" y="5" width="222" height="4" rx="2" fill="#ffffff"/>

            <text

              text-anchor="middle"

              font-family="Poppins, sans-serif"

              letter-spacing="0.35"
            ><tspan fill="#ffffff">NOUS </tspan><tspan fill="#ffce3e">REJOINDRE</tspan></text>
          </svg>
        </a>

        <!-- 5. LE TRAIN DU RAS-LE-BOL -->
        <a
          class="desktop-menu-item"
          href="https://accueil.letrainduraslebol.fr/"
          aria-label="Le train du ras-le-bol"
        >
          <svg
            class="menu-button-svg"
            viewBox="0 0 250 56"
            role="img"
            aria-hidden="true"
            focusable="false"
          >
            <rect x="14" y="5" width="222" height="4" rx="2" fill="#ffffff"/>
            <rect x="14" y="47" width="222" height="4" rx="2" fill="#ffffff"/>

            <text
              x="125"
              y="34"

          </svg>

      </nav>

      <!-- ACCUEIL VISIBLE SUR MOBILE -->

      <a
        class="mobile-home-link"
        href="index.html"
        aria-label="Accueil"
      >
        <svg
          class="mobile-home-svg"
          viewBox="0 0 250 56"
          role="img"
          aria-hidden="true"
          focusable="false"
        >
          <rect x="14" y="5" width="222" height="4" rx="2" fill="#ffffff"/>
          <rect x="14" y="47" width="222" height="4" rx="2" fill="#ffffff"/>

          <text
            x="125"
            y="34"
            text-anchor="middle"
            font-family="Poppins, sans-serif"
            font-size="15"
            font-weight="800"
            letter-spacing="0.35"
            fill="#ffce3e"
          >ACCUEIL</text>
        </svg>
      </a>

      <!-- BOUTON HAMBURGER MOBILE -->

      <button
        class="menu-toggle"
        type="button"
        aria-label="Ouvrir le menu"
        aria-expanded="false"
        aria-controls="mobile-menu"

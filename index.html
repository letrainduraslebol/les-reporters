<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Les reporters — Le train du ras-le-bol</title>

  <style>
    :root {
      --bleu: #002b59;
      --jaune: #ffce3e;
      --blanc: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: var(--blanc);
      color: var(--bleu);
    }

    .hero {
      min-height: 100vh;
      background: var(--bleu);
      color: var(--blanc);

      display: flex;
      align-items: center;

      padding: 80px 8%;
    }

    .hero-contenu {
      max-width: 1100px;
    }

    .sur-titre {
      color: var(--jaune);
      font-size: 1rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 24px;
    }

    h1 {
      color: var(--jaune);
      font-size: clamp(3rem, 8vw, 7rem);
      line-height: 0.95;
      margin: 0 0 30px 0;
      max-width: 1000px;
    }

    .sous-titre {
      font-size: clamp(1.2rem, 2.5vw, 2rem);
      line-height: 1.4;
      max-width: 850px;
      margin: 0;
    }

    .signature {
      margin-top: 50px;
      font-size: clamp(1.3rem, 3vw, 2.2rem);
      font-weight: 700;
      color: var(--blanc);
    }

    section {
      padding: 90px 8%;
    }

    section h2 {
      font-size: clamp(2.2rem, 5vw, 4.5rem);
      line-height: 1.05;
      margin-top: 0;
      color: var(--bleu);
    }

    section p {
      max-width: 900px;
      font-size: 1.15rem;
      line-height: 1.75;
    }

    @media (max-width: 700px) {
      .hero {
        min-height: auto;
        padding: 80px 28px;
      }

      section {
        padding: 65px 28px;
      }

      h1 {
        font-size: 3.2rem;
      }
    }
  </style>
</head>

<body>

  <header class="hero">
    <div class="hero-contenu">

      <div class="sur-titre">
        Le train du ras-le-bol
      </div>

      <h1>
        Groupes WhatsApp<br>
        « Les reporters »
      </h1>

      <p class="sous-titre">
        Groupes appartenant à la communauté en ligne
        « Le train du ras-le-bol »
      </p>

      <div class="signature">
        Tout commence avec vous.
      </div>

    </div>
  </header>

</body>
</html>

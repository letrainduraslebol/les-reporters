<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Les reporters — Le train du ras-le-bol</title>

  <style>
    :root {
      --bleu: #002b59;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      background: var(--bleu);
    }

    body {
      min-height: 100vh;
    }

    .banniere {
      width: min(1920px, calc(100% - 72px));
      margin: 32px auto 36px;
    }

    .banniere img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
    }

    @media (max-width: 700px) {
      .banniere {
        width: calc(100% - 32px);
        margin: 16px auto 24px;
      }
    }
  </style>
</head>

<body>

  <main class="banniere">
    <img
      src="71000-00750.01_Les-reporters-banniere-index.webp"
      alt="Groupes WhatsApp Les reporters — Tout commence avec vous."
      width="2048"
      height="746"
      fetchpriority="high"
    >
  </main>

</body>

</html>
